# Render Blueprint: New + -> Blueprint -> pick this repository.
# Creates a managed PostgreSQL and one Docker web service. WebSockets work out of the box.
databases:
  - name: workspace-db
    databaseName: workspace
    user: workspace
    plan: free

services:
  - type: web
    name: realtime-workspace
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workspace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Optional: add a Render Key Value (Redis) instance and set REDIS_URL to
      # scale to several instances (see README, "Scaling").
